<!doctype html><html lang="zh"><meta charset="utf-8"><title>盆地与四季建造区 · 实机样板</title><style>body{margin:0;background:#18252b;color:#e6e8df;font:17px/1.75 system-ui}main{max-width:1350px;margin:auto;padding:32px}h1{font-size:30px}p{color:#b8c8c6}nav{display:flex;gap:20px;flex-wrap:wrap}a{color:#b8ded4}figure{margin:36px 0 50px}img{display:block;width:100%;border-radius:8px}figcaption{margin:12px 0;font-size:21px}small{display:block;font-size:15px;color:#a8b9b9}code{background:#263b43;padding:2px 7px}</style><main><h1>中央盆地 + 四座圆形建造区</h1><p>这是新方向的独立实机样板，原来的整图仍保留。中央低盆地、四条可往返的窄阶梯、四座平坦的干燥建造平台，入口留出城墙缺口。以下为本次编译后的游戏截图。</p><p><a href="handoff.html">打开 Hammer 分工与入门说明</a></p><nav><a href="#overview">整体结构</a><a href="#basin">中央出生盆地</a><a href="#peach">东 · 桃花青石</a><a href="#snow">北 · 冰雪石庭</a><a href="#snow_material_close">冰雪平台 · 新材质近景</a><a href="#pine">西 · 松林苔地</a><a href="#sand">南 · 暖砂石庭</a><a href="#stair_gate">阶梯与城墙缺口</a></nav><figure id="overview"><a href="overview.png"><img src="overview.png" alt="整体结构"></a><figcaption>整体结构<small>中央低盆地与四座高平台；东桃花、北冰雪、西松林、南暖砂。</small></figcaption></figure><figure id="basin"><a href="basin.png"><img src="basin.png" alt="中央出生盆地"></a><figcaption>中央出生盆地<small>中心是浅水洼，四个出口通向阶梯。</small></figcaption></figure><figure id="peach"><a href="peach.png"><img src="peach.png" alt="东 · 桃花青石"></a><figcaption>东 · 桃花青石<small>偏青绿的石地、苔草过渡与边缘桃花。</small></figcaption></figure><figure id="snow"><a href="snow.png"><img src="snow.png" alt="北 · 冰雪石庭"></a><figcaption>北 · 冰雪石庭<small>冷灰石地与积雪混合，内部保持平坦。</small></figcaption></figure><figure id="snow_material_close"><a href="snow_material_close.png"><img src="snow_material_close.png" alt="冰雪平台 · 新材质近景"></a><figcaption>冰雪平台 · 新材质近景<small>独立 Blender 石板模型烘焙颜色与法线；地面仍然平坦，积雪沿边缘覆盖。</small></figcaption></figure><figure id="pine"><a href="pine.png"><img src="pine.png" alt="西 · 松林苔地"></a><figcaption>西 · 松林苔地<small>草、土、岩石与旧石路连续混合。</small></figcaption></figure><figure id="sand"><a href="sand.png"><img src="sand.png" alt="南 · 暖砂石庭"></a><figcaption>南 · 暖砂石庭<small>暖色砂土与岩石地表；内部无水域。</small></figcaption></figure><figure id="stair_gate"><a href="stair_gate.png"><img src="stair_gate.png" alt="阶梯与城墙缺口"></a><figcaption>阶梯与城墙缺口<small>单一窄通道可上下往返，顶端预留城墙位置。</small></figcaption></figure><p>测试地图：<code>survival_basin_review</code>。四个方向已检查双向寻路、阶梯高度和通道外阻挡。城墙建造规则与正式出怪配置尚未迁移；此页用于确认局部结构、美术和尺度。</p></main>
