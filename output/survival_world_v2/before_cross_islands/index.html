<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>苟发育 · 地形过渡修订</title><style>body{margin:0;background:#111916;color:#e7eee9;font:16px/1.7 system-ui,sans-serif}main{max-width:1300px;margin:auto;padding:42px 24px}h1{font-size:30px;margin:0}p{color:#adbbb1}nav{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 40px}a{color:#bbd7bd;text-decoration:none}nav a{padding:8px 18px;border:1px solid #3d5145;border-radius:7px}figure{margin:0 0 42px}img{width:100%;display:block;border-radius:8px;background:#070b08}figcaption{padding:12px 0;color:#c5d2ca}small{color:#a1b2a5}</style><main><h1>苟发育 · 地形过渡修订</h1><p>128 × 128 原生地形 · 圆形主岛与方形浅水湖 · 材质渐变过渡<br>以下均为游戏实际截图；功能区沿用先前确认的布局。</p><nav><a href="#overview">全图</a><a href="#central_island">主岛</a><a href="#upper_training">顶部练功房</a><a href="#lower_training">下方练功房</a><a href="#snow_camps">雪地区域</a><a href="#boss_islands">Boss 区域</a></nav><div id="gallery"></div><small>地图：survival_world_v2。此版本用于审阅地形和环境，全部战斗与传送逻辑尚未迁移到新坐标。</small></main><script>const shots=[['overview','全图：功能区与不可通行岩石高地'],['central_island','主岛：中央湖与周围营地区域'],['upper_training','顶部练功房：较低地势与不同环境'],['lower_training','下方练功房：较高地势与环境区分'],['snow_camps','N41–N50：雪地与四个绿色营地'],['boss_islands','十诫与材料挑战区域'],['tree_close','主岛近景：草土与石路过渡'],['shallow_lake','可穿行的方形浅水湖'],['volcanic_arena','火山挑战区：玄武岩与熔岩纹理']];for(const [id,title]of shots){const f=document.createElement('figure');f.id=id;const a=document.createElement('a');a.href=id+'.png';a.target='_blank';const img=document.createElement('img');img.src=id+'.png';img.alt=title;img.loading='lazy';a.append(img);f.append(a);const c=document.createElement('figcaption');c.textContent=title;f.append(c);document.querySelector('#gallery').append(f)}</script></html>
