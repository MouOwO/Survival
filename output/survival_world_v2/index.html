<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圆形草地主岛 · 实机对照</title><style>body{margin:0;background:#e4eae5;color:#294136;font:16px/1.7 system-ui}main{max-width:1600px;margin:auto;padding:24px}h1{font-size:28px;margin-bottom:8px}nav{position:sticky;top:0;background:#e4eae5ee;padding:12px 0;z-index:2}button,select{padding:10px;margin:4px;border:1px solid #b1bfb4;border-radius:4px;background:#f7f9f5;color:#294136;cursor:pointer}.frame{overflow:auto;max-height:86vh;background:#172f31}img{display:block;width:100%}a{color:#2c6254}p{max-width:1100px}</style><main><h1>圆形草地主岛与海面</h1><p>四个方向的岛台改为圆形草地；中央保留小圆湖及四条浅水通道。两层陆地平台、城门接敌宽度和台阶保留。以下均为实际 Dota 2 截图。</p><nav><select id="view" onchange="render()"><option value="central_island">四座草地岛与中央圆湖</option><option value="tower_stairs">岸坡、草地与台阶</option><option value="overview">全图鸟瞰</option><option value="shallow_lake">中央浅水</option><option value="grass_paving">草石交错过渡</option></select><button onclick="before=false;render()">本轮效果</button><button id="old" onclick="before=true;render()">修改前</button><button onclick="document.querySelector('#shot').style.width='100%'">适合窗口</button><button onclick="document.querySelector('#shot').style.width='175%'">放大</button></nav><div class="frame"><img id="shot" alt="游戏实际截图"></div><p id="caption"></p><p>草、土、岩石与零散铺石采用连续顶点混合。草石接缝加宽并加入不规则变化；树木与地被集中在草土区域。海面使用官方滚动海浪材质，中央浅水与外围海面共用交界色，并渐变到可见的浅水底色。</p><h2>海面动画检查</h2><p>下面两张是同一机位、间隔约五秒的实拍。点击切换观察浪纹位置；这是滚动纹理、法线和泡沫动画，未模拟物理海浪或水位起伏。</p><button onclick="motion=1-motion;document.querySelector('#motion').src='ocean_motion_'+(motion?'b':'a')+'.png'">切换五秒前后</button><div class="frame"><img id="motion" src="ocean_motion_a.png" alt="同机位海面动画采样"></div><p><a href="verification.json">实机通行检查</a> · <a href="round_island_design.json">地形设计记录</a> · <a href="round_water_design.json">海面材质记录</a> · <a href="round_motion_validation.json">海浪画面变化检查</a></p></main><script>let before=false,motion=0;function render(){const v=document.querySelector('#view').value;const available=['central_island','tower_stairs','overview'].includes(v);document.querySelector('#old').disabled=!available;document.querySelector('#shot').src=((before&&available)?'before_round_grass_islands/':'')+v+'.png?v='+Date.now();document.querySelector('#caption').textContent=(before&&available?'修改前':'本轮实机')+' · '+document.querySelector('#view').selectedOptions[0].textContent;}render();</script></html>
