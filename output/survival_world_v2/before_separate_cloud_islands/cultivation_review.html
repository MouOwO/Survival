<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修仙云海 · 全图审阅</title>
<style>body{margin:0;background:#e5e9e9;color:#22383c;font:17px/1.75 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:24px}h1{font-size:30px;margin-bottom:8px}p,figcaption{color:#506468}button,select{padding:9px 15px;border:1px solid #9aadae;background:#f7faf8;color:#274748;border-radius:5px;margin:4px;cursor:pointer}button.on{background:#35666c;color:white}nav{position:sticky;top:0;background:#e5e9e9f5;padding:10px 0;z-index:2}.frame{overflow:auto;max-height:85vh;background:#101b24;border-radius:8px}.frame img{display:block;width:100%;max-width:none}figure{margin:24px 0}a{color:#2d666e}.other{width:100%;display:block;border-radius:8px}</style>
<main><h1>修仙云海 · 全图审阅</h1><p>外围厚云分层遮住地形边缘，内部低云布置在非活动区。青瓦亭、东方松树、花树和浅色石材统一场景；中央十字、战斗平台和台阶保持清晰。</p>
<nav><select id="view" onchange="render()"><option value="overview">整图鸟瞰</option><option value="central_island">中央四岛</option><option value="tower_stairs">玩家视角 · 平台与台阶</option><option value="cloud_edge">外围云层</option><option value="cloud_band">内部云带</option><option value="hot_spring">花树温泉</option><option value="training_close">练功房视野</option></select><button id="new" class="on" onclick="choose(false)">新版</button><button id="old" onclick="choose(true)">改版前</button><button onclick="zoom(1)">适合窗口</button><button onclick="zoom(1.5)">放大 1.5 倍</button><button onclick="zoom(2)">放大 2 倍</button></nav>
<div class="frame"><img id="image" alt="修仙云海地图实机画面"></div><p id="caption"></p>
<p><a href="overview.png">打开鸟瞰原图</a> · <a href="cultivation_notes.md">修改说明</a> · <a href="verification.json">通行与资源检查</a></p></main>
<script>let before=false;const stamp='?v='+Date.now();function choose(v){before=v;render()}function zoom(v){document.getElementById('image').style.width=v*100+'%'}function render(){const view=document.getElementById('view').value;const hasOld=!view.startsWith('cloud_');if(!hasOld)before=false;document.getElementById('old').disabled=!hasOld;document.getElementById('new').className=before?'':'on';document.getElementById('old').className=before?'on':'';document.getElementById('image').src=(before?'before_cultivation_clouds/':'')+view+'.png'+stamp;document.getElementById('caption').textContent=view==='overview'?'鸟瞰新版拉远镜头以容纳外围云层；可放大并滚动查看各个功能区。':'游戏实机画面。'}render();</script></html>
