<main><h1>恢复山体 · 修订岩石材质</h1><p>恢复连续山地与树林。山体改用低反差石面，缓坡混入少量碎石，山脚过渡回土色。主岛、练功房与道路恢复原布局。</p>
<nav><select id="view" onchange="render()"><option value="overview">全图鸟瞰</option><option value="mountain_detail">新材质近景</option><option value="cloud_band">山地与功能区</option><option value="mountain_canopy">温泉周边山地</option><option value="camp_boundary">山脚与营地</option><option value="central_island">中央主岛</option><option value="tower_stairs">三层平台与楼梯</option><option value="upper_training">上方练功房</option></select><button id="new" class="on" onclick="choose(false)">本轮修订</button><button id="old" onclick="choose(true)">原山体版本</button><button onclick="zoom(1)">适合窗口</button><button onclick="zoom(1.5)">放大</button><button onclick="zoom(2)">放大 2 倍</button></nav>

</main><script>let before=false;const stamp='?v='+Date.now();function choose(b){before=b;render()}function zoom(v){document.getElementById('shot').style.width=(100*v)+'%'}function render(){const v=document.getElementById('view').value,canCompare=v!=='mountain_detail';document.getElementById('old').disabled=!canCompare;let b=before&&canCompare;document.getElementById('new').className=b?'':'on';document.getElementById('old').className=b?'on':'';document.getElementById('shot').src=(b?'before_separate_cloud_islands/':'')+v+'.png'+stamp;document.getElementById('caption').textContent=canCompare?(b?'改造前带山体的实机版本':'本轮实机画面'):'新增山体近景机位'}render();</script></html>
