<main><h1>月下主岛 · 城门前水道收窄</h1><p>中央保留宽水路；从每条水道的一半距离开始渐变收窄，控制台阶处城门的接敌面。</p><p>前半段宽 1152；距中心 1152 处开始收窄，2048 处恢复为 640，并保持到台阶前。台阶恢复原宽 576，侧边护岸延续至上端。</p>
