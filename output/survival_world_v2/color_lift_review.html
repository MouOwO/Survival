<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>百鬼夜行 · 亮度与色彩调整</title>
<style>body{margin:0;background:#18212b;color:#e5e8ec;font:17px/1.75 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:26px 24px}h1{font-size:30px}p,figcaption{color:#c0cbd5}img{width:100%;display:block;border-radius:6px}figure{margin:30px 0}a{color:#e3c6a3}button,select{background:#33465b;color:#fff;border:1px solid #8095ab;border-radius:5px;padding:10px 16px;margin:4px;cursor:pointer}button[aria-pressed=true]{background:#597693}nav{position:sticky;top:0;background:#18212bf5;padding:10px 0;z-index:1}#state{padding-left:12px}</style>
<main><h1>百鬼夜行 · 更明亮的月夜</h1><p>抬高环境亮度与背光面的可见度，让草木、岩石和水面恢复颜色层次；保留暖色灯火与冷色月光。挑战房仍采用疏林、石墙和荒寺庭院的气氛。</p>
<nav><select id="scene" aria-label="选择区域" onchange="render()"><option value="central_island">四岛全貌</option><option value="tower_stairs">主岛平台与侧楼梯</option><option value="upper_training">上方练功房</option><option value="volcanic_arena">火山挑战房</option><option value="hot_spring">樱花温泉</option><option value="boss_islands">Boss 房间</option></select><button id="after" onclick="setBefore(false)" aria-pressed="true">调整后</button><button id="before" onclick="setBefore(true)" aria-pressed="false">调整前</button><span id="state">调整后</span></nav>
<figure><img id="comparison" alt="相同机位的亮度与色彩对比"><figcaption>切换前后画面，对比阴影、地面色彩与水面层次。图片均来自游戏实机。</figcaption></figure>
<figure><img src="training_close.png" alt="练功房近景"><figcaption>练功房 · 灰绿地面、较明亮的石材与稀疏枯木。</figcaption></figure>
<figure><img src="hot_spring.png" alt="樱花温泉"><figcaption>温泉 · 蓝绿色池水、粉色树冠与暖色灯火。</figcaption></figure>
<p><a href="verification.json">查看地图与通行验证</a> · <a href="color_lift_notes.md">查看本轮修改记录</a></p></main>
<script>let before=false;const stamp='?v='+Date.now();for(const img of document.images)if(img.getAttribute('src'))img.src+=stamp;function setBefore(value){before=value;render()}function render(){document.getElementById('comparison').src=(before?'before_color_lift/':'')+document.getElementById('scene').value+'.png'+stamp;document.getElementById('state').textContent=before?'调整前':'调整后';document.getElementById('before').setAttribute('aria-pressed',before);document.getElementById('after').setAttribute('aria-pressed',!before)}render();</script></html>
