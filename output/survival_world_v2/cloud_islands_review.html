<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独立云岛 · 实机审阅</title>
<style>body{margin:0;background:#e6ebe9;color:#273c40;font:16px/1.7 system-ui}main{max-width:1600px;margin:auto;padding:24px}h1{font-size:26px;margin:0}p{color:#53686a}nav{position:sticky;top:0;background:#e6ebe9ee;padding:12px 0;z-index:2}button,select{padding:10px 14px;margin:3px;border:1px solid #aabeb9;border-radius:5px;background:#fafbf9;color:#294843;cursor:pointer}.on{background:#365f59;color:white}figure{margin:0}.frame{max-height:86vh;overflow:auto;background:#101f25}img{display:block;width:100%;max-width:none}a{color:#2c655e}small{color:#546a6a}</style>
<main><h1>独立云岛 · 最新实机</h1><p>切开闲置山地，保留活动平台；恢复外围云海，以低云带衔接岛侧。小房间去除碎绿草块，保留大场地的柔和草地。</p>
<nav><select id="view" onchange="render()"><option value="overview">全图鸟瞰</option><option value="upper_training">上方练功房</option><option value="lower_training">下方练功房</option><option value="cloud_band">岛屿间云带</option><option value="cloud_edge">外围云海</option><option value="training_close">房间铺地近景</option><option value="boss_islands">Boss 平台</option><option value="hot_spring">温泉岛</option><option value="central_island">中央四岛</option><option value="tower_stairs">三层平台与楼梯</option><option value="grass_paving">草地与道路</option></select><button id="new" class="on" onclick="choose(false)">新版</button><button id="old" onclick="choose(true)">上版</button><button onclick="zoom(1)">适合窗口</button><button onclick="zoom(1.5)">放大</button><button onclick="zoom(2)">放大 2 倍</button></nav>
<figure><div class="frame"><img id="shot" alt="Dota 2 实际游戏截图"></div><figcaption id="caption"></figcaption></figure><p><a href="overview.png">鸟瞰原图</a> · <a href="cloud_islands_notes.md">本轮改动与限制</a> · <a href="verification.json">实机检查记录</a></p>
<small>云使用烘焙云片分层模拟体积。固定俯视机位下检查；低机位的平面感与缺少实时受光仍属于素材限制。</small>
</main><script>let before=false;const stamp='?v='+Date.now();function choose(b){before=b;render()}function zoom(v){document.getElementById('shot').style.width=(100*v)+'%'}function render(){const v=document.getElementById('view').value;document.getElementById('new').className=before?'':'on';document.getElementById('old').className=before?'on':'';document.getElementById('shot').src=(before?'before_separate_cloud_islands/':'')+v+'.png'+stamp;document.getElementById('caption').textContent=before?'上一版实机画面':'新版实机画面'}render();</script></html>
