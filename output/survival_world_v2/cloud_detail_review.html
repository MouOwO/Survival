<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>清晨云层与组件细化 · 实机预览</title><style>body{margin:0;background:#dce4e6;color:#233b44;font:16px/1.6 system-ui}main{max-width:1600px;margin:auto;padding:24px}h1{font-size:28px}nav{position:sticky;top:0;padding:12px;background:#dce4e6ee;z-index:2}button,select{padding:9px;margin:4px;border:1px solid #9cafb6;background:#f3f5f4;color:#233b44;border-radius:5px;cursor:pointer}.frame{overflow:auto;max-height:86vh;background:#65818e}#shot{display:block;width:100%}.assets{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.assets img{width:100%}figure{margin:0;background:#eaf0ef;padding:10px}a{color:#345e70}.note{max-width:1000px}small{color:#566e78}</style><main><h1>清晨云层与组件细化</h1><p class="note">实际 Dota 2 地图截图。外围使用四种厚云轮廓，内部使用低云带与薄雾；新版亭阁、扎根松树和台阶外侧收边已接入少量原有位置。</p><nav><select id="view" onchange="render()"><option value="overview">全图鸟瞰</option><option value="cloud_edge">外围云与山体</option><option value="cloud_band">内部低云带</option><option value="central_island">主岛与亭阁</option><option value="tower_stairs">台阶与平台收边</option><option value="mountain_detail">山间装饰</option></select><button onclick="before=false;render()">本轮实机</button><button onclick="before=true;render()">修改前</button><button onclick="document.querySelector('#shot').style.width='100%'">适合窗口</button><button onclick="document.querySelector('#shot').style.width='180%'">放大</button></nav><div class="frame"><img id="shot" alt="实机预览"></div><p id="caption"></p><p class="note">云由 Blender 密度场烘焙为独立透明资源，边缘与缩小后的透明通道已检查。运行时仍是朝向镜头的云片，光照已烘焙；侧看、绕看或大幅放大存在局限，不能当作真正的体积云。</p><p><a href="verification.json">实机通行与资源检查</a> · <a href="cloud_composition_validation.json">云遮挡范围与地形一致性检查</a> · <a href="../xianxia_kit/detail_pass/geometry_validation.json">组件几何检查</a></p><h2>本轮 Blender 可复用组件</h2><p>亭阁、两种松树和台阶侧边已用于主地图。直线与转角收边件已编译入资源库，供后续按具体边界装配。</p><div class="assets"><figure><img src="../xianxia_kit/detail_pass/previews/a01_pavilion_detail.png"><figcaption>a01_pavilion_detail<br><small>41,746 三角面 · 已确认材质</small></figcaption></figure><figure><img src="../xianxia_kit/detail_pass/previews/v01_pine_rooted_0.png"><figcaption>v01_pine_rooted_0<br><small>22,170 三角面 · 已确认材质</small></figcaption></figure><figure><img src="../xianxia_kit/detail_pass/previews/v01_pine_rooted_1.png"><figcaption>v01_pine_rooted_1<br><small>22,170 三角面 · 已确认材质</small></figcaption></figure><figure><img src="../xianxia_kit/detail_pass/previews/t08_platform_edge.png"><figcaption>t08_platform_edge<br><small>730 三角面 · 已确认材质</small></figcaption></figure><figure><img src="../xianxia_kit/detail_pass/previews/t08_platform_corner.png"><figcaption>t08_platform_corner<br><small>978 三角面 · 已确认材质</small></figcaption></figure><figure><img src="../xianxia_kit/detail_pass/previews/t08_stair_cheek.png"><figcaption>t08_stair_cheek<br><small>352 三角面 · 已确认材质</small></figcaption></figure></div><p><a href="../xianxia_kit/detail_pass/xianxia_detail_modules.blend">Blender 组件源文件</a> · <a href="../xianxia_kit/cloud_revision_v2/index.html">云组件独立对照</a></p></main><script>let before=false;function render(){const v=document.querySelector('#view').value;document.querySelector('#shot').src=(before?'before_cloud_integration_v2/':'')+v+'.png?v='+Date.now();document.querySelector('#caption').textContent=(before?'修改前':'本轮实机')+' · '+document.querySelector('#view').selectedOptions[0].textContent;}render();</script></html>
