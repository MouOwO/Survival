<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主岛火炬清理</title>
<style>body{margin:0;background:#e5ebe7;color:#293e39;font:16px/1.7 system-ui}main{max-width:1600px;margin:auto;padding:24px}h1{font-size:26px;margin:0}p{color:#52655d}nav{position:sticky;top:0;background:#e5ebe7ee;padding:12px 0;z-index:2}button,select{padding:10px 14px;margin:3px;border:1px solid #acbeb0;border-radius:5px;background:#fafbf8;color:#29483a;cursor:pointer}.on{background:#446453;color:white}figure{margin:0}.frame{max-height:86vh;overflow:auto;background:#12201a}img{display:block;width:100%;max-width:none}a{color:#315f47}small{color:#53665a}</style>
<main><h1>主岛火炬清理</h1><p>清理主岛 44 组火炬，同时移除配套火焰与局部灯光。可切换同机位修改前后画面。</p>
<nav><select id="view" onchange="render()"><option value="central_island">中央主岛全景</option><option value="island_levels">主岛平台近景</option><option value="tower_stairs" selected>楼梯与平台转角</option><option value="overview">全图鸟瞰</option></select><button id="new" class="on" onclick="choose(false)">本轮修订</button><button id="old" onclick="choose(true)">修改前</button><button onclick="zoom(1)">适合窗口</button><button onclick="zoom(1.5)">放大</button><button onclick="zoom(2)">放大 2 倍</button></nav>
<figure><div class="frame"><img id="shot" alt="Dota 2 实际游戏截图"></div><figcaption id="caption"></figcaption></figure><p>实机检查：148 项通行采样通过；四向水道、城门接敌宽度及八条侧楼梯通过。</p><p><a href="../user_materials_20260914/index.html">压缩包参考图库</a> · <a href="torch_verification.json">实机检查记录</a></p>
</main><script>let before=false;const stamp='?v='+Date.now();function choose(b){before=b;render()}function zoom(v){document.getElementById('shot').style.width=(100*v)+'%'}function render(){const v=document.getElementById('view').value,canCompare=['central_island','island_levels','tower_stairs'].includes(v);document.getElementById('old').disabled=!canCompare;let b=before&&canCompare;document.getElementById('new').className=b?'':'on';document.getElementById('old').className=b?'on':'';document.getElementById('shot').src=(b?'before_island_torch_cleanup/':'')+v+'.png'+stamp;document.getElementById('caption').textContent=canCompare?(b?'修改前：平台和楼梯上的密集火炬':'本轮实机画面'):'本轮实机画面'}render();</script></html>
