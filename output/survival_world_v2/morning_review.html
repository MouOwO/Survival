<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>清晨云带 · 地图审阅</title>
<style>body{margin:0;background:#e5eae7;color:#263c3d;font:16px/1.75 system-ui,sans-serif}main{max-width:1600px;margin:auto;padding:24px}h1{margin:0;font-size:28px}p{color:#506360}nav{position:sticky;top:0;padding:12px 0;background:#e5eae7f5;z-index:2}button,select{padding:10px 15px;margin:3px;border:1px solid #abbab4;background:#f7f9f6;border-radius:5px;color:#334f4b;cursor:pointer}.on{background:#436b64;color:white}figure{margin:16px 0}.frame{overflow:auto;max-height:86vh;background:#162224;border-radius:6px}#shot{display:block;width:100%;max-width:none}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:repeating-conic-gradient(#7e918d 0% 25%,#8da09c 0% 50%) 50% / 24px 24px}.card img{width:100%;display:block}a{color:#285f58}summary{cursor:pointer}small{color:#566964}</style>
<main><h1>清晨云带 · 最新实机</h1><p>取消矩形云墙和碎小云团，改为少量开口云带；提亮地面暗部，降低草地饱和度，统一土石与道路过渡。中央十字、三层平台和楼梯保持原结构。</p>
<nav><select id="view" onchange="render()"><option value="overview">整图鸟瞰</option><option value="cloud_band">内部云带</option><option value="cloud_edge">外围高低云层</option><option value="grass_paving">草地与道路</option><option value="camp_boundary">营地边缘</option><option value="training_close">练功房近景</option><option value="grass_detail">草地颜色</option><option value="central_island">中央四岛</option><option value="tower_stairs">平台与楼梯</option><option value="hot_spring">温泉与局部桃花</option></select><button id="new" class="on" onclick="choose(false)">新版</button><button id="old" onclick="choose(true)">上版</button><button onclick="zoom(1)">适合窗口</button><button onclick="zoom(1.5)">放大</button><button onclick="zoom(2)">放大 2 倍</button></nav>
<figure><div class="frame"><img id="shot" alt="Dota 2 实际游戏截图"></div><figcaption id="caption"></figcaption></figure>
<p><a href="overview.png">鸟瞰原图</a> · <a href="morning_notes.md">改动与素材限制</a> · <a href="verification.json">检查记录</a></p>
<details><summary>本轮 Blender 云素材（透明度显示在棋盘背景上）</summary><p>四张 2048 × 1024 RGBA 烘焙云片。明暗对应固定的清晨光照，适用于当前俯视机位；低角度绕看仍会暴露云片的平面性质。</p><div class="cards"><div class="card"><img src="cloud_cards/morning_billows_a.png"></div><div class="card"><img src="cloud_cards/morning_billows_b.png"></div><div class="card"><img src="cloud_cards/morning_ribbon_a.png"></div><div class="card"><img src="cloud_cards/morning_ribbon_b.png"></div></div></details>
</main><script>let before=false;const stamp='?v='+Date.now();function choose(b){before=b;render()}function zoom(v){document.getElementById('shot').style.width=(100*v)+'%'}function render(){const view=document.getElementById('view').value;document.getElementById('new').className=before?'':'on';document.getElementById('old').className=before?'on':'';document.getElementById('shot').src=(before?'before_open_cloud_bands/':'')+view+'.png'+stamp;document.getElementById('caption').textContent=view==='cloud_edge'?'外围机位已移到西北云层，上版该机位在西侧，不能逐像素对照。':'同名机位的实机画面，可切换新版与上版。'}render();</script></html>
