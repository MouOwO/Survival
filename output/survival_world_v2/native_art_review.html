<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>官方材质 · 场景试配</title>
<script src="native_art_status.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{if(!window.nativeArtVerified){document.querySelector('#gallery').replaceChildren();document.querySelector('#compare').disabled=true;const p=document.createElement('p');p.textContent='新版已编译，尚待实机截图与验证；本页暂不展示上一轮图片，避免混淆。';document.querySelector('#gallery').append(p)}});</script>
<style>body{margin:0;background:#111b23;color:#eaf0ec;font:16px/1.7 system-ui,sans-serif}main{max-width:1360px;margin:auto;padding:32px 24px}h1{font-size:30px;margin:0}p,figcaption{color:#b8c8d2}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}a{color:#98d3ef}nav a{padding:6px 14px;border:1px solid #385367;border-radius:6px;text-decoration:none}figure{margin:0 0 32px}img{width:100%;display:block;border-radius:8px}figcaption{padding:10px 0}.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.compare{grid-template-columns:1fr}}button{background:#294457;color:white;border:0;padding:9px 18px;cursor:pointer;border-radius:6px}</style>
<main><h1>官方材质 · 场景试配</h1><p>蓝色河水、细叶草地、暖石板、金桦与秋枫、冰晶、玄武岩，以及铁栅牢笼。以下为本项目游戏实拍。</p><nav><a href="#central_island">主岛与蓝水</a><a href="#grass_paving">草地过渡</a><a href="#upper_training">练功房</a><a href="#volcanic_arena">火山</a><a href="#prison_floor">牢笼</a><a href="#overview">全图</a><a href="native_art_notes.md">资源选型记录</a></nav><p><button id="compare">显示上一版对照</button> 点击图片打开原尺寸。对照模式中左侧为上一版，右侧为本轮。</p><div id="gallery"></div></main>
<script>const shots=[['central_island','四向主岛 · 蓝色河水与 TI10 草地'],['shallow_lake','保留可步行的十字浅水'],['grass_paving','草叶遮罩衔接暖色石板'],['upper_training','顶部练功房 · 金色桦树与雪松'],['lower_training','下方练功房 · 分区环境'],['camp_transition','营地 · 秋枫与泥石过渡'],['volcanic_arena','玄武岩与熔岩裂缝'],['prison_floor','冷色旧石板 · 铁栅与牢笼'],['snow_camps','冰雪营地与晶簇'],['boss_islands','挑战房间'],['tree_close','原岛近景'],['mountain_canopy','山脊树林'],['overview','128 × 128 全图']];let comparison=false;function draw(){document.querySelector('#gallery').replaceChildren();for(const[id,title]of shots){const section=document.createElement('section');section.id=id;if(comparison&&id!=='prison_floor')section.className='compare';for(const old of comparison&&id!=='prison_floor'?[true,false]:[false]){const f=document.createElement('figure'),a=document.createElement('a'),img=document.createElement('img'),c=document.createElement('figcaption'),url=(old?'before_native_art/':'')+id+'.png';a.href=url;a.target='_blank';img.src=url+'?v='+Date.now();img.alt=title;img.loading='lazy';c.textContent=(old?'上一版 · ':'本轮 · ')+title;a.append(img);f.append(a,c);section.append(f)}document.querySelector('#gallery').append(section)}}document.querySelector('#compare').onclick=()=>{comparison=!comparison;document.querySelector('#compare').textContent=comparison?'只显示本轮':'显示上一版对照';draw()};draw();</script></html>
