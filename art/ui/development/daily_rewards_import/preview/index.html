<!doctype html><meta charset="utf-8"><title>每日奖励 · 代码运行预览（非游戏截图）</title><link rel="stylesheet" href="style.css"><body><script src="adapter.js"></script><script>const xml="<root>\n    <styles><include src=\"file://{resources}/styles/custom_game/archive.css\" /><include src=\"file://{resources}/styles/custom_game/daily_rewards.css\" /><include src=\"file://{resources}/styles/custom_game/archive_kit.css\" /><include src=\"file://{resources}/styles/custom_game/common/ui_components.css\"/><include src=\"file://{resources}/styles/custom_game/common/ui_typography.css\"/><include src=\"file://{resources}/styles/custom_game/daily_assets.css\"/></styles>\n    <scripts><include src=\"file://{resources}/scripts/custom_game/common/ui_registry.js\"/><include src=\"file://{resources}/scripts/custom_game/daily_resources.js\"/><include src=\"file://{resources}/scripts/custom_game/common/ui_components.js\"/><include src=\"file://{resources}/scripts/custom_game/ui_layers.js\" /><include src=\"file://{resources}/scripts/custom_game/reward_presentation.js\" /><include src=\"file://{resources}/scripts/custom_game/archive.js\" /><include src=\"file://{resources}/scripts/custom_game/daily_rewards.js\" /><include src=\"file://{resources}/scripts/custom_game/treasure_history.js\" /></scripts>\n    <Panel class=\"ArchiveRoot\" hittest=\"false\">\n        <Button id=\"ArchiveEntry\" onactivate=\"GameUI.CustomUIConfig().SurvivalArchive.Toggle()\">\n            <Panel class=\"ArchiveEntryScroll ArchiveKitIcon KitIcon_book\" hittest=\"false\" />\n            <Label class=\"ArchiveEntryText\" text=\"存档\" />\n        </Button>\n        <Label id=\"EndlessStatus\" class=\"ArchiveHidden\" hittest=\"false\" />\n        <Button id=\"TreasureEntry\" onactivate=\"GameUI.CustomUIConfig().SurvivalTreasure.Toggle()\"><Label text=\"宝物\" /></Button>\n        <Panel id=\"TreasureWindow\" class=\"ArchiveHidden\">\n            <Panel id=\"TreasureHeader\"><Label text=\"最近获得的宝物\" /><Button onactivate=\"GameUI.CustomUIConfig().SurvivalTreasure.Toggle()\"><Label text=\"×\" /></Button></Panel>\n            <Label id=\"TreasureHint\" text=\"本局最近4次肉鸽选择 · 最新在前\" />\n            <Panel id=\"TreasureCards\" />\n            <Panel id=\"TreasureTooltip\" class=\"ArchiveHidden\" hittest=\"false\" hittestchildren=\"false\"><Label id=\"TreasureTooltipName\" /><Label id=\"TreasureTooltipEffect\" /></Panel>\n        </Panel>\n        <Button id=\"DailyEntry\" onactivate=\"GameUI.CustomUIConfig().SurvivalDaily.Open(false)\">\n            <Panel id=\"DailyChest\"><Panel class=\"ChestLid\" /><Panel class=\"ChestBase\" /><Panel class=\"ChestLock\" /></Panel><Label text=\"每日奖励\" />\n        </Button>\n        <Button id=\"PassEntry\" onactivate=\"GameUI.CustomUIConfig().SurvivalDaily.Open(true)\"><Label text=\"月卡\" /></Button>\n        <Button id=\"DailyScrim\" class=\"ArchiveHidden\" />\n        <Panel id=\"DailyWindow\" class=\"ArchiveHidden\">\n            <Panel id=\"DailyFrame\" hittest=\"false\" hittestchildren=\"false\" />\n            <Panel id=\"DailyHeader\" hittest=\"false\" class=\"DailyHeader\"><Label id=\"DailyHeading\" text=\"每日奖励\" /><Button id=\"DailyClose\" /></Panel>\n            <Panel id=\"DailyClaimPage\" hittest=\"false\">\n                <Label id=\"DailySubtitle\" /><Button id=\"DailyPassStatus\"><Label id=\"DailyPassStatusText\" /></Button><Label id=\"DailyCount\" />\n                <Panel id=\"DailyCards\" hittest=\"false\" />\n                <Label id=\"DailyRuleLine\" /><Button id=\"DailyRules\"><Label text=\"奖励说明\" /></Button>\n                <Button id=\"DailyMakeup\"><Label text=\"补签最早漏签日\" /></Button>\n                <Button id=\"DailyClaim\"><Label id=\"DailyClaimText\" text=\"领取今日奖励\" /></Button>\n            </Panel>\n            <Panel id=\"DailyPassPage\" class=\"ArchiveHidden\">\n                <Label class=\"DailySection\" text=\"通行证权益\" /><Label id=\"PassValidity\" /><Label id=\"PassPrice\" />\n                <Panel id=\"DailySpecials\" /><Button id=\"PassPurchase\"><Label id=\"PassPurchaseText\" /></Button>\n                <Button id=\"DailyBack\"><Label text=\"返回每日奖励\" /></Button>\n            </Panel>\n            <Label id=\"DailyNotice\" text=\"正在读取签到档案…\" />\n            <Panel id=\"DailyRulesText\" class=\"ArchiveHidden\"><Label id=\"DailyRulesBody\" /></Panel>\n            <Panel id=\"DailyTooltip\" class=\"ArchiveHidden\" hittest=\"false\" hittestchildren=\"false\"><Label id=\"DailyTooltipName\" /><Label id=\"DailyTooltipEffect\" /></Panel>\n        </Panel>\n        <Button id=\"ArchiveScrim\" class=\"ArchiveHidden\" onactivate=\"GameUI.CustomUIConfig().SurvivalArchive.Close()\" />\n        <Panel id=\"ArchiveWindow\" class=\"ArchiveHidden\">\n            <Panel id=\"ArchiveHeader\">\n                <Panel id=\"ArchiveBook\" class=\"ArchiveKitIcon KitIcon_book\" hittest=\"false\" /><Panel id=\"ArchiveTitleBlock\"><Label id=\"ArchiveTitle\" text=\"存 档\" /><Label id=\"ArchiveSubtitle\" text=\"征途留痕 · 永久成长\" /></Panel>\n                <Button id=\"ArchiveClose\" onactivate=\"GameUI.CustomUIConfig().SurvivalArchive.Close()\"><Panel class=\"ArchiveKitIcon KitIcon_close\" hittest=\"false\" /></Button>\n            </Panel>\n            <Panel id=\"ArchiveBody\">\n                <Panel id=\"ArchiveTabs\" />\n                <Panel id=\"ArchiveContent\">\n                    <Panel id=\"ArchivePageHeader\"><Label id=\"ArchivePageTitle\" text=\"通关存档\" /><Label id=\"ArchiveSummary\" text=\"\" /></Panel>\n                    <Label id=\"ArchiveHint\" text=\"\" />\n                    <Panel id=\"ArchiveFilters\"><RadioButton id=\"ArchiveFilter_all\" group=\"ArchiveFilters\" onactivate=\"GameUI.CustomUIConfig().SurvivalArchive.Filter('all')\"><Label text=\"全部\" /></RadioButton><RadioButton id=\"ArchiveFilter_unlocked\" group=\"ArchiveFilters\" onactivate=\"GameUI.CustomUIConfig().SurvivalArchive.Filter('unlocked')\"><Label text=\"已解锁\" /></RadioButton><RadioButton id=\"ArchiveFilter_locked\" group=\"ArchiveFilters\" onactivate=\"GameUI.CustomUIConfig().SurvivalArchive.Filter('locked')\"><Label text=\"未解锁\" /></RadioButton></Panel><Panel id=\"ArchiveGrid\" />\n                    <Label id=\"ArchiveEmpty\" text=\"正在读取存档…\" />\n                    <Panel id=\"ArchiveDrawBar\" class=\"ArchiveHidden\">\n                        <Label id=\"ArchiveDrawResult\" text=\"\" />\n                        <Label id=\"ArchiveTickets\" text=\"正在读取抽奖券…\" />\n                        <Button id=\"ArchiveDraw\"><Label text=\"抽奖 ×1\" /></Button>\n                    </Panel>\n                    <Panel id=\"ArchiveFooter\">\n                        <Label id=\"ArchiveStatus\" text=\"\" />\n                        <Label id=\"ArchiveFaith\" class=\"ArchiveHidden\" text=\"\" />\n                    </Panel>\n                </Panel>\n            </Panel>\n        </Panel>\n        <Panel id=\"ArchiveTooltip\" class=\"ArchiveHidden\" hittest=\"false\" hittestchildren=\"false\">\n            <Label id=\"ArchiveTooltipName\" text=\"\" />\n            <Label id=\"ArchiveTooltipEffect\" text=\"\" />\n        </Panel>\n    </Panel>\n</root>\n";const tree=new DOMParser().parseFromString(xml,'text/xml');function mount(node,parent){const p=new Panel(node.tagName,parent,node.getAttribute('id')||'');if(node.tagName==='Button')p.el.classList.add('button');(node.getAttribute('class')||'').split(' ').filter(Boolean).forEach(c=>p.AddClass(c));if(node.hasAttribute('text'))p.text=node.getAttribute('text');for(const c of node.children)mount(c,p);return p;}for(const id of ['DailyEntry','PassEntry','DailyScrim','DailyWindow'])mount(tree.querySelector('[id="'+id+'"]'),root);</script><script src="../../../panorama/src/scripts/custom_game/common/ui_registry.js"></script><script src="../../../panorama/src/scripts/custom_game/daily_resources.js"></script><script src="../../../panorama/src/scripts/custom_game/ui_layers.js"></script><script src="../../../panorama/src/scripts/custom_game/common/ui_components.js"></script><script src="../../../panorama/src/scripts/custom_game/daily_rewards.js"></script><script src="fixture.js"></script></body>
